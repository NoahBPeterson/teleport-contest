name: Score
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Bare clone, no submodules: nethack-c/recorder/ is gitignored build
      # output and is NOT available here. The game's data files come from
      # data/nethackdir/, vendored as JS modules by tools/vendor-data.mjs, and
      # js/boot/harness.mjs serves them through an in-memory VFS.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # >= 22.15 for module.registerHooks(), which js/boot/isolation.mjs
          # uses to give each segment a fresh transpiled module graph without
          # spawning a process. '22' resolves to the newest 22.x.
          node-version: '22'

      - name: Overlay frozen fixture (ISAAC64 + Terminal)
        run: |
          cp frozen/isaac64.js js/isaac64.js
          cp frozen/terminal.js js/terminal.js

      # Proves runSegment still works inside the judge's sandbox
      # (node --permission, reads confined to the fork) and that no forbidden
      # runtime import is reachable from js/jsmain.js. Runs before scoring so a
      # sandbox regression is not hidden by a green score.
      - name: Sandbox parity gate
        run: node tools/strict-score.mjs

      - name: Score public sessions
        run: |
          node frozen/ps_test_runner.mjs sessions/ \
            2>score-stderr.txt | tee score-stdout.txt
          cat score-stderr.txt >&2

      - name: Extract score summary
        run: |
          # Parse results JSON and create a summary
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('score-stdout.txt', 'utf8');
            const idx = raw.lastIndexOf('__RESULTS_JSON__');
            if (idx < 0) { console.log('No results found'); process.exit(1); }
            const data = JSON.parse(raw.slice(idx + '__RESULTS_JSON__'.length).trim());
            const results = data.results || [];
            const passed = results.filter(r => r.passed).length;
            const total = results.length;
            const rngPct = total > 0
              ? (results.reduce((s, r) => s + (r.metrics?.rngCalls?.matched || 0), 0)
                 / results.reduce((s, r) => s + (r.metrics?.rngCalls?.total || 1), 0) * 100).toFixed(1)
              : '0.0';
            console.log(JSON.stringify({ passed, total, rngPct, timestamp: data.timestamp }));
            fs.writeFileSync('score-summary.json', JSON.stringify({ passed, total, rngPct, timestamp: data.timestamp, results: results.map(r => ({ session: r.session, passed: r.passed, rng: r.metrics?.rngCalls, screen: r.metrics?.screens, cursor: r.metrics?.cursor })) }, null, 2));
          "

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: score-results
          path: |
            score-summary.json
            score-stdout.txt
